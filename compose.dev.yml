# Local development stack (DEPLOY.md §19). Same images and service names as production;
# only this file publishes Postgres, Vite and Mailpit ports (CONVENTION.md §12.3).
# Use the Makefile: `make up`, `make sh`, `make check`.
name: edqa-dev

x-php: &php
  build:
    context: .
    target: dev
    args:
      UID: "${UID:-1000}"
      GID: "${GID:-1000}"
  image: edqa-dev-php:local
  env_file: [.env]
  environment:
    XDEBUG_MODE: "${XDEBUG_MODE:-off}"
  volumes:
    - .:/var/www/html
    # Composer's packages in a volume, not through the bind mount: tens of thousands of files that
    # PHP reads on every boot, slow across Docker Desktop's file sharing (Windows, macOS). `make up`
    # installs into it; the host's own vendor/ (IDE, native tools) is separate.
    - vendor:/var/www/html/vendor
  extra_hosts: ["host.docker.internal:host-gateway"]

services:
  app:
    <<: *php
    command: ["app"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports: ["8080:80"]
    volumes:
      - ./docker/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./public:/srv/public:ro
    depends_on:
      app: { condition: service_healthy }

  vite:
    image: node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      # Route helpers are generated by the app container (`make up`); this image has no PHP.
      WAYFINDER_SKIP: "1"
      # File events don't cross a Windows/macOS bind mount; poll instead.
      VITE_USE_POLLING: "1"
    ports: ["5173:5173"]
    volumes:
      - .:/app
      # Keep the container's Linux node_modules separate from the host's.
      - vite-node-modules:/app/node_modules

  worker:
    <<: *php
    command: ["artisan", "queue:work", "--queue=default,rescore,exports,low", "--tries=1"]
    depends_on: [app]

  scheduler:
    <<: *php
    command: ["scheduler"]
    profiles: [scheduler]            # opt-in locally, so ODK isn't pulled every 10 minutes
    depends_on: [app]

  # A mock ODK Central for local development and e2e (docker/odk-mock/README.md), opt-in:
  # `make odk-mock-up`, then `make odk-mock-seed n=200`. PHP's built-in server on the app image,
  # serving storage/app/odk-mock. Plain http: the app accepts it only with
  # ODK_ALLOW_INSECURE_LOCAL=true and APP_ENV=local.
  odk-mock:
    <<: *php
    command: ["php", "-S", "0.0.0.0:8080", "docker/odk-mock/router.php"]
    profiles: [odk]
    environment:
      ODK_MOCK_DATA: /var/www/html/storage/app/odk-mock
    ports: ["127.0.0.1:8090:8080"]   # local only: curl it from the host

  # Playwright end-to-end tests (`make e2e`), opt-in. The image's browsers match @playwright/test
  # 1.64.1 in package.json: bump both together. It reuses the vite service's node_modules and
  # forwards its own localhost:8080 / :5173 to web and vite (tests/e2e/run.sh), so the
  # browser sees the developer's origins.
  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    profiles: [e2e]
    working_dir: /app
    entrypoint: ["sh", "tests/e2e/run.sh"]
    environment:
      E2E_FORWARD: "8080=web:80,5173=vite:5173"
      CI: "1"
    ipc: host
    volumes:
      - .:/app
      - vite-node-modules:/app/node_modules
    depends_on: [web, vite]

  postgres:
    image: postgres:16-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    environment: { POSTGRES_PASSWORD: postgres }
    ports: ["127.0.0.1:5432:5432"]   # local only
    shm_size: 256m
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-dev.sql:/docker-entrypoint-initdb.d/01.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edqa"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-bookworm@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f

  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports: ["127.0.0.1:8025:8025"]

volumes:
  pgdata: {}
  vite-node-modules: {}
  vendor: {}
