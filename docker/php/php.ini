; Production PHP settings for every PHP role (app, workers, scheduler, migrate).
; Development overrides live in php.dev.ini (dev target only).

expose_php = Off
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; The portal takes no file uploads (ODK is the only data source).
file_uploads = On
upload_max_filesize = 2M
post_max_size = 8M

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

; Containers run in UTC; the app shows WAT via APP_TIMEZONE.
date.timezone = UTC

realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.use_strict_mode = 1
zend.exception_ignore_args = On
