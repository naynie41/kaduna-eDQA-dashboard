; OPcache for production images. Code never changes inside a running container, so files are
; not re-checked (validate_timestamps=0). php.dev.ini turns checking back on.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
