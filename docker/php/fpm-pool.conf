; Loaded after the image's www.conf and zz-docker.conf, so these win.
[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
; Reached by Caddy over the internal Compose network; nothing publishes this port.
listen = 9000

; 1 GB container limit ÷ ~50 MB per worker (DEPLOY.md §2.3).
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Healthcheck: cgi-fcgi against /ping answers "pong" (DEPLOY.md §7.1, CONVENTION.md §12.1).
ping.path = /ping
ping.response = pong

; Settings come from the container environment (env_file), not a .env file in production.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
request_terminate_timeout = 120s
