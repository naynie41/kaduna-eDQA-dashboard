; Development overrides (dev target only), loaded after php.ini and opcache.ini.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
zend.exception_ignore_args = Off
max_execution_time = 120
memory_limit = 512M

; Source is bind-mounted: re-check files for changes (at most every 2 s).
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
; Tests and artisan run in the CLI; without OPcache each test re-compiles the framework from the
; bind mount, which is slow on Windows and macOS.
opcache.enable_cli = 1

; Xdebug is installed but off unless XDEBUG_MODE is set (e.g. XDEBUG_MODE=debug make up).
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
