; Development overrides (dev target only), loaded after php.ini and opcache.ini.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
zend.exception_ignore_args = Off
max_execution_time = 120
memory_limit = 512M

; Source is bind-mounted: re-check files on every request.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Xdebug is installed but off unless XDEBUG_MODE is set (e.g. XDEBUG_MODE=debug make up).
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
