[project]
name = "edqa-discovery"
version = "0.0.0"
description = "Phase 0 throwaway tools for investigating the Kaduna eDQA ODK Central data (read-only)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "lxml>=5.2",       # XForm XML parsing; pyxform deliberately not used
    "rapidfuzz>=3.9",
    "rich>=13.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Scripts are run directly; nothing is packaged. Installing only pulls the dependencies.
[tool.setuptools]
packages = []
py-modules = []
